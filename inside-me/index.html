<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<title>🫀 Inside Me</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
    background: #FFF4E6;
    color: #3D405B; -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: stretch; }

  /* ---------- organ meters ---------- */
  .meters {
    display: flex; gap: 4px; justify-content: center; flex-wrap: nowrap;
    padding: calc(6px + env(safe-area-inset-top)) 6px 4px;
  }
  .meter {
    flex: 1 1 0; min-width: 0; max-width: 72px;
    background: #FFFBF4; border-radius: 12px; padding: 4px 2px 5px;
    text-align: center; box-shadow: 0 2px 0 rgba(201,138,94,0.18);
  }
  .meter .mi { font-size: clamp(15px, 4.2vw, 21px); line-height: 1.1; display: block; }
  .meter .mn { font-size: clamp(8px, 2.3vw, 10px); color: #8a7a68; display: block; margin-bottom: 2px; }
  .bar { display: block; height: 5px; border-radius: 4px; background: #F0E2CE; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 4px; transition: width .5s ease-out; }

  /* ---------- body canvas ---------- */
  .stage { flex: 1; min-height: 0; position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

  /* ---------- discovery caption ---------- */
  .caption {
    position: absolute; left: 8px; right: 8px; bottom: 6px;
    background: rgba(255,251,244,0.95); border-radius: 14px;
    padding: 8px 12px; text-align: center;
    font-size: clamp(13px, 3.6vw, 17px); line-height: 1.35; color: #3D405B;
    box-shadow: 0 4px 14px rgba(201,138,94,0.22);
    opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s;
    pointer-events: none;
  }
  .caption.show { opacity: 1; transform: translateY(0); }
  .caption b { color: #D97706; }

  /* ---------- plate ---------- */
  .plate {
    display: flex; gap: 5px; justify-content: center; align-items: center;
    padding: 5px 8px 2px;
  }
  .slot {
    width: clamp(34px, 9.5vw, 46px); height: clamp(34px, 9.5vw, 46px);
    border-radius: 12px; background: #FFFBF4;
    border: 2px dashed #E3CDB0;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(18px, 5vw, 26px);
  }
  .slot.fun { border-style: solid; border-color: #FFD98A; background: #FFF7E3; }
  .slot.full { border-style: solid; border-color: #7FD1A0; background: #F2FBF6; }

  /* ---------- food tray ---------- */
  .tray {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    padding: 4px 8px calc(62px + env(safe-area-inset-bottom));
  }
  .food {
    background: #FFFBF4; border: none; border-radius: 14px;
    padding: 6px 2px 5px; cursor: pointer; font-family: inherit;
    box-shadow: 0 3px 0 rgba(201,138,94,0.25);
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    min-height: 56px;
  }
  .food:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(201,138,94,0.25); }
  .food .fe { font-size: clamp(21px, 6vw, 30px); line-height: 1.1; }
  .food .fn { font-size: clamp(9px, 2.6vw, 11px); color: #6b5c4b; line-height: 1.15; }
  .food[disabled] { opacity: .35; }

  /* ---------- buttons / overlay ---------- */
  .overlay { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; background: rgba(61,64,91,0.55); padding: 18px; }
  .overlay.hide { display: none; }
  .panel {
    background: #FFFBF4; border-radius: 24px; padding: 22px 20px;
    max-width: 430px; width: 100%; text-align: center;
    box-shadow: 0 18px 44px rgba(61,64,91,0.4);

  .panel p { font-size: clamp(13px, 3.4vw, 16px); color: #6b5c4b; margin: 8px 0; line-height: 1.5; }
  .panel .go {
    margin-top: 12px; width: 100%; padding: 14px; border: none; border-radius: 15px;
    font-family: inherit; font-size: clamp(18px, 4.8vw, 23px); font-weight: bold;
    cursor: pointer; background: #5BC0BE; color: #fff; box-shadow: 0 5px 0 #3E9A98;

  .panel .go:active { transform: translateY(3px); box-shadow: 0 2px 0 #3E9A98; }
  .panel .go.alt { background: #F2A65A; box-shadow: 0 5px 0 #C97F38; }
  .stars { font-size: clamp(30px, 9vw, 46px); letter-spacing: 4px; margin: 4px 0; }
  .groupRow { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
  .gchip {
    font-size: clamp(12px, 3.2vw, 15px); padding: 5px 10px; border-radius: 20px;
    background: #F0E2CE; color: #8a7a68;
  }
  .gchip.got { background: #D8F3E4; color: #2f7d5a; }
  .pick { display: flex; gap: 8px; justify-content: center; margin: 12px 0 4px; }
  .pickBtn {
    flex: 1; background: #FFF7E3; border: 2px solid #FFD98A; border-radius: 15px;
    padding: 10px 4px; cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .pickBtn.sel { background: #D8F3E4; border-color: #7FD1A0; }
  .pickBtn .pe { font-size: clamp(26px, 7vw, 36px); }
  .pickBtn .pn { font-size: clamp(10px, 2.8vw, 12px); color: #6b5c4b; }
  .rules { text-align: left; margin: 10px 0 4px; }

  .rule .rt { font-size: clamp(12.5px, 3.3vw, 15px); color: #6b5c4b; line-height: 1.45; }

  .panel .fine b { color: #3D405B; }

<script>
"use strict";
/* ============================================================================
   INSIDE ME — feed a body, watch what happens inside.

   LANGUAGE RULES (deliberate, research-backed — please keep them):
   Foods are never "good"/"bad"/"junk"/"unhealthy". They are "everyday foods"
   and "sometimes foods", which describes HOW OFTEN we eat them, not whether
   the child is being good. Moralised food language is a documented risk
   factor for disordered eating, and Go/Slow/Whoa-style traffic lights were
   publicly criticised after children named them as a trigger.
   Nothing here ever subtracts points, shows a frown, or makes the body sad.

   A nutrient's benefit is revealed AFTER eating as a discovery, never used
   beforehand as a reason to eat. Maimaran & Fishbach (JCR 2014) found
   preschoolers told crackers would "make them strong" ate about HALF as many.

   No calories, no weight, no body-size change anywhere. (AAP 2016.)
   ========================================================================== */

/* ---- organ meters: the "toolkit" a body collects ---- */
const ORGANS = [
  { k:"build", i:"💪", n:"Build",  col:"#E8907E" },
  { k:"bones", i:"🦴", n:"Bones",  col:"#E8C98A" },
  { k:"brain", i:"🧠", n:"Brain",  col:"#F6A8C0" },
  { k:"eyes",  i:"👀", n:"Eyes",   col:"#F2A65A" },

    line:"Real protein in there, and a lot of salt.", after:"salt" },
  { e:"🍦", n:"Ice cream", g:"sometimes", c:"white", sug:3.5, teeth:1,
    line:"Cold and creamy! Milk and sugar together.", after:"energy" },

    line:"Real milk AND real sugar — this one is both at once.", after:"halo" },

/* ============================ palette ============================ */
const C = {
  bg:"#FFF4E6", vig:"#F3D9BC",
  skin:"rgba(255,217,184,0.40)", skinSolid:"#FFD9B8", ink:"#C98A5E",
  hair:"#6B4A33", hairHi:"#8A6245",
  heart:"#FF6B81", heartHi:"#FF9FAE",
  lung:"#F7A8A8", lungHi:"#F6D1D1",
  stom:"#F2A65A", stomHi:"#FBD7AE", chyme:"#E88C3A",
  gut:"#F6B3A0", gutRim:"#D98B78", gutHi:"#FFD6C9",
  brain:"#F6A8C0", brainFold:"#E2869F", brainHi:"#FFC9DB",
  bone:"#FFF8EC", boneSh:"#E6D7BE",
  muscle:"#E8907E",
  stomSh:"#D98B3E",
  liver:"#D99A86", liverSh:"#B87A66", liverHi:"#F0C4B2",
  gall:"#A8D5A2", spleen:"#C98FB0", panc:"#F2CE8A",
  kidney:"#D98B9E", kidneySh:"#B86F82", bladder:"#F2DFA0",

};

/* ============================ design space ============================ */
const W = 360, H = 640, CX = 180;
const cv = document.getElementById("c");
let ctx = cv.getContext("2d");
let fit = 1, offX = 0, offY = 0, DPR = 1;
let T = 0, lastTs = 0;
let reduced = false;
try { reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){}

/* ============================ small helpers ============================ */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp01(v){ return v<0?0:v>1?1:v; }
function easeOutBack(t){ const s=1.70158; return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2); }
function rr(g,x,y,w,h,r){ if (g.roundRect) { g.beginPath(); g.roundRect(x,y,w,h,r); }
  else { g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
         g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); } }
function bean(g,x,y,rx,ry,rot,notch){
  g.save(); g.translate(x,y); g.rotate(rot||0);
  g.beginPath();
  g.moveTo(0,-ry);
  g.bezierCurveTo( rx*1.2,-ry*0.7,  rx*1.2, ry*0.7, 0, ry);
  g.bezierCurveTo(-rx*1.2, ry*0.7, -rx*(notch?0.35:1.2),-ry*0.7, 0,-ry);
  g.closePath(); g.restore();
}

/* Breathing: inhale fast (40% of cycle), exhale slow (60%). A plain sine
   reads as "floating"; this reads as alive. Range exactly 0..1. */
const BREATH_HZ = 0.30;                       // ~18 breaths/min, a resting child
function breath(t){
  const p = ((t * BREATH_HZ) % 1 + 1) % 1;
  return p < 0.40 ? 0.5 - 0.5*Math.cos(Math.PI*(p/0.40))
                  : 0.5 + 0.5*Math.cos(Math.PI*((p-0.40)/0.60));
}
/* Heart: two sharp thumps then a long quiet diastole. Not a sine. */
function thump(x){
  if (x <= 0 || x >= 1) return 0;
  const a = 0.26;
  return x < a ? 1-(1-x/a)*(1-x/a) : (1+Math.cos(Math.PI*(x-a)/(1-a)))/2;
}
function heartBeat(t, bpm){
  const p = ((t*(bpm/60)) % 1 + 1) % 1;
  return thump(p/0.14)*1.00 + thump((p-0.28)/0.11)*0.55;
}
function bob(t){ return reduced ? 0 : Math.sin(t*2*Math.PI*0.18)*2.4 + Math.sin(t*2*Math.PI*0.47)*0.6; }
function sway(t){ return reduced ? 0 : Math.sin(t*2*Math.PI*0.13)*0.012; }

/* Blink: scheduled, never periodic. Humans blink every 2-6s for ~150ms. */
const blink = { next: 2.0, t: -1, dbl: false };
function updateBlink(dt){
  if (blink.t >= 0){
    blink.t += dt;
    if (blink.t > 0.17){
      blink.t = -1;
      if (!blink.dbl && Math.random() < 0.2){ blink.dbl = true; blink.next = 0.22; }
      else { blink.dbl = false; blink.next = 2.5 + Math.random()*3.5; }
    }
  } else { blink.next -= dt; if (blink.next <= 0) blink.t = 0; }
}
function eyeOpen(){
  if (blink.t < 0) return 1;
  const c = 0.07, o = 0.10;
  return blink.t < c ? 1 - blink.t/c : Math.min(1, (blink.t-c)/o);
}

/* ============================ body outline ============================ */
/* One half written as offsets from the centre line, then mirrored, so the
   figure is exactly symmetric. A roomier torso than a stick figure, because
   there are a lot of organs to fit in here and still leave gaps between them. */
const TOP_Y = 168;
const TORSO = [
  [ 36,172,   68,176,   84,198],
  [ 98,220,  100,248,   92,272],
  [ 86,300,   78,314,   76,334],
  [ 74,356,   84,376,   88,396],
  [ 92,418,   82,440,   62,452],
];
function traceMirrored(p, segs, topY){
  p.moveTo(CX, topY);
  for (const s of segs) p.bezierCurveTo(CX+s[0],s[1], CX+s[2],s[3], CX+s[4],s[5]);
  const last = segs[segs.length-1];
  p.lineTo(CX - last[4], last[5]);
  for (let i = segs.length-1; i >= 0; i--){
    const s = segs[i], prev = i ? segs[i-1] : null;
    const ex = prev ? CX - prev[4] : CX, ey = prev ? prev[5] : topY;
    p.bezierCurveTo(CX-s[2],s[3], CX-s[0],s[1], ex, ey);
  }
  p.closePath();
}
let torsoPath = null;
function buildTorso(){ torsoPath = new Path2D(); traceMirrored(torsoPath, TORSO, TOP_Y); }

const FOOT_Y = 544;        // sway pivot + where the figure ends

/* ============================ organ geometry ============================ */
function stomachPath(){
  const p = new Path2D();
  p.moveTo(0,0);

  p.bezierCurveTo( 58, 92,  34,118,   2,118);

function coilPoints(x, y, w, h, rows, seed){
  const rnd = mulberry32(seed), pts = [], dy = h/(rows-1);
  for (let i = 0; i < rows; i++){
    const left = i % 2 === 0;
    const x0 = left ? x : x+w, x1 = left ? x+w : x;
    for (let k = 0; k <= 4; k++){
      const u = k/4;
      pts.push({ x: x0 + (x1-x0)*u + (rnd()-0.5)*6,
                 y: y + i*dy + Math.sin(u*Math.PI)*dy*0.22 + (rnd()-0.5)*3 });
    }
    if (i < rows-1) pts.push({ x: x1 + (left ? 12 : -12), y: y + i*dy + dy*0.5 });
  }
  return pts;
}
function catmullPath(pts, tension){
  const p = new Path2D(), k = (tension||1)/6;
  p.moveTo(pts[0].x, pts[0].y);
  for (let i = 0; i < pts.length-1; i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||pts[i+1];
    p.bezierCurveTo(p1.x+(p2.x-p0.x)*k, p1.y+(p2.y-p0.y)*k,
                    p2.x-(p3.x-p1.x)*k, p2.y-(p3.y-p1.y)*k, p2.x, p2.y);
  }
  return p;
}

  const c = document.createElement("canvas");

  c.width = Math.max(1, Math.ceil(w*s)); c.height = Math.max(1, Math.ceil(h*s));
  const g = c.getContext("2d");
  g.setTransform(s, 0, 0, s, 0, 0);
  g.lineCap = "round"; g.lineJoin = "round";
  drawFn(g);
  return { c:c, w:w, h:h };
}

function makeGlowSprite(size, rgb){
  const c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d"), r = size/2;
  const grad = g.createRadialGradient(r,r,0, r,r,r);
  grad.addColorStop(0.00, "rgba("+rgb+",1)");
  grad.addColorStop(0.25, "rgba("+rgb+",0.55)");
  grad.addColorStop(1.00, "rgba("+rgb+",0)");
  g.fillStyle = grad; g.fillRect(0,0,size,size);
  return c;
}

/* ============================ flow paths ============================ */
function makeFlow(pts, samples){
  samples = samples || 160;
  const p = [], L = [0], k = 1/6;
  for (let i = 0; i < pts.length-1; i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||pts[i+1];
    const c1x=p1.x+(p2.x-p0.x)*k, c1y=p1.y+(p2.y-p0.y)*k;
    const c2x=p2.x-(p3.x-p1.x)*k, c2y=p2.y-(p3.y-p1.y)*k;
    const n = Math.ceil(samples/(pts.length-1));
    for (let j=0;j<n;j++){ const t=j/n, u=1-t;
      p.push({ x:u*u*u*p1.x+3*u*u*t*c1x+3*u*t*t*c2x+t*t*t*p2.x,
               y:u*u*u*p1.y+3*u*u*t*c1y+3*u*t*t*c2y+t*t*t*p2.y }); }
  }
  p.push(pts[pts.length-1]);
  for (let i=1;i<p.length;i++) L[i]=L[i-1]+Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);
  const total = L[L.length-1] || 1;
  return { total:total, at:function(s){
    const d = clamp01(s)*total;
    let lo=0, hi=L.length-1;
    while (hi-lo>1){ const m=(lo+hi)>>1; if (L[m]<=d) lo=m; else hi=m; }
    const f=(d-L[lo])/((L[hi]-L[lo])||1);
    return { x:p[lo].x+(p[hi].x-p[lo].x)*f, y:p[lo].y+(p[hi].y-p[lo].y)*f,
             a:Math.atan2(p[hi].y-p[lo].y,p[hi].x-p[lo].x) };
  }};
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const cw = cv.clientWidth, ch = cv.clientHeight;
  if (!cw || !ch) return;
  lastCW = cw; lastCH = ch;

  ctx = cv.getContext("2d");

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.save();
  if (shake.t > 0){
    shake.t -= dt;
    const k = shake.amp*Math.pow(Math.max(0,shake.t)/shake.dur, 2);
    ctx.translate((Math.random()*2-1)*k, (Math.random()*2-1)*k);
  }
  ctx.translate(offX, offY); ctx.scale(fit, fit);
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  const b  = breath(T);
  const hb = heartBeat(T, bpm);
  const by = bob(T);

  ctx.save();
  ctx.translate(CX, FOOT_Y); ctx.rotate(sway(T)); ctx.translate(-CX, -FOOT_Y + by);

  /* --- aura: rim glow when the body is well watered --- */
  const aura = organGlow.water*0.5 + (meters.water/100)*0.35;
  if (aura > 0.02){
    ctx.globalCompositeOperation = "lighter";
    const steps = [[34,0.030],[23,0.055],[14,0.085]];
    for (let i=0;i<steps.length;i++){
      ctx.lineWidth = steps[i][0];
      ctx.strokeStyle = "rgba(255,240,200," + (steps[i][1]*aura).toFixed(3) + ")";
      ctx.stroke(torsoPath);
    }
    ctx.globalCompositeOperation = "source-over";
  }

  /* --- limbs, then their bones showing faintly through --- */
  function limb(ax,ay,bx,by2,cx2,cy,w0,w1){
    ctx.strokeStyle = C.skinSolid;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(bx,by2,cx2,cy);
    ctx.lineWidth = w0; ctx.stroke();
    ctx.beginPath(); ctx.moveTo((ax+bx)/2,(ay+by2)/2); ctx.quadraticCurveTo(bx,by2,cx2,cy);
    ctx.lineWidth = w1; ctx.stroke();
  }
  const flex = organGlow.build;
  limb(264,202, 300,250, 298,392, 32+flex*5, 25+flex*4);
  limb( 96,202,  60,250,  62,392, 32+flex*5, 25+flex*4);
  limb(216,446, 236,494, 228,540, 42, 31);
  limb(144,446, 124,494, 132,540, 42, 31);
  blit(ctx, bakedLimbBone, 0, 0);
  ctx.fillStyle = "#F7C9A3"; ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
  [[298,400],[62,400]].forEach(function(h){ ctx.beginPath(); ctx.ellipse(h[0],h[1],13,13,0,0,6.2832); ctx.fill(); ctx.stroke(); });
  [[230,546],[130,546]].forEach(function(f){ ctx.beginPath(); ctx.ellipse(f[0],f[1],20,11,0,0,6.2832); ctx.fill(); ctx.stroke(); });

  /* --- skeleton, vessels, soft organs (all baked) --- */
  ctx.save();
  if (organGlow.bones > 0.01){
    ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = organGlow.bones*0.5;
    ctx.drawImage(GLOW.cream, TARGET.bones.x-74, TARGET.bones.y-74, 148, 148);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }
  blit(ctx, bakedSkel, 0, 0);
  ctx.restore();
  ctx.globalAlpha = 0.85; blit(ctx, bakedVess, 0, 0); ctx.globalAlpha = 1;
  ctx.save();
  if (organGlow.tummy > 0.01){
    ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = organGlow.tummy*0.45;
    ctx.drawImage(GLOW.green, TARGET.tummy.x-70, TARGET.tummy.y-60, 140, 120);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }
  blit(ctx, bakedVisc, 0, 0);
  ctx.restore();

  /* --- diaphragm: the breathing muscle, flattens as the chest fills --- */
  ctx.strokeStyle = C.diaph; ctx.lineWidth = 5; ctx.globalAlpha = 0.75;
  ctx.beginPath(); ctx.moveTo(108, 298);
  ctx.quadraticCurveTo(180, 274 + 9*b, 252, 298);
  ctx.stroke(); ctx.globalAlpha = 1;

  /* --- food pipe, and the bolus actually travelling down it --- */
  ctx.strokeStyle = C.gullet; ctx.lineWidth = 12; ctx.globalAlpha = 0.9;
  ctx.beginPath(); ctx.moveTo(GULLET[0].x, GULLET[0].y);
  for (let i=1;i<GULLET.length;i++) ctx.lineTo(GULLET[i].x, GULLET[i].y);
  ctx.stroke(); ctx.globalAlpha = 1;
  if (bulgeT >= 0 && GULLET_FLOW){
    const u = clamp01(bulgeT/0.7);
    const pt = GULLET_FLOW.at(u);
    ctx.fillStyle = C.chyme;
    ctx.beginPath(); ctx.ellipse(pt.x, pt.y, 8, 9.5, 0,0,6.2832); ctx.fill();
  }

  /* --- lungs: they move far more than the skin does --- */
  const lsx = 1+0.05*b, lsy = 1+0.11*b;
  [[145,1],[217,-1]].forEach(function(L){
    ctx.save(); ctx.translate(L[0],242); ctx.scale(lsx,lsy);
    ctx.fillStyle = C.lung;
    ctx.beginPath();
    ctx.moveTo(0,-46);
    ctx.bezierCurveTo(24*L[1],-40, 32*L[1],-4, 27*L[1],30);
    ctx.bezierCurveTo(23*L[1],50, 5*L[1],54, -5*L[1],44);
    ctx.bezierCurveTo(-15*L[1],34, -17*L[1],4, -12*L[1],-20);
    ctx.bezierCurveTo(-10*L[1],-34, -6*L[1],-45, 0,-46);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#E88B8B"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = C.lungHi; ctx.lineWidth = 2; ctx.globalAlpha = 0.7;
    for (let i=0;i<3;i++){                               // airway branches inside
      ctx.beginPath(); ctx.moveTo(-6*L[1], -16+i*14);
      ctx.quadraticCurveTo(8*L[1], -12+i*14, 17*L[1], -4+i*15); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  });
  ctx.strokeStyle = C.lungHi; ctx.lineWidth = 11;        // trachea
  ctx.beginPath(); ctx.moveTo(172,176); ctx.lineTo(170,212); ctx.stroke();
  ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(170,210); ctx.quadraticCurveTo(156,222,150,236); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(170,210); ctx.quadraticCurveTo(188,222,196,234); ctx.stroke();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.2;
  for (let i=0;i<4;i++){ const y=182+i*8; ctx.beginPath(); ctx.moveTo(166,y); ctx.lineTo(178,y); ctx.stroke(); }

  /* --- heart --- */
  ctx.save();
  ctx.translate(177, 256); ctx.scale(1+0.17*hb, 1+0.12*hb);
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 0.18+0.32*hb;
  ctx.drawImage(GLOW.pink, -36,-36, 72,72);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = C.heart; ctx.beginPath();
  ctx.moveTo(0,19);
  ctx.bezierCurveTo(-24,3, -24,-17, -11,-17);
  ctx.bezierCurveTo(-4,-17, 0,-11, 0,-7);
  ctx.bezierCurveTo( 0,-11, 4,-17, 11,-17);
  ctx.bezierCurveTo(24,-17, 24,3, 0,19);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#E04E63"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = C.heartHi; ctx.globalAlpha = 0.6;
  ctx.beginPath(); ctx.ellipse(-7,-7,4,5.5,-0.4,0,6.2832); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();

  /* --- stomach --- */
  ctx.save();
  ctx.translate(STOM_X, STOM_Y);
  ctx.scale(STOM_S*(1+0.03*Math.sin(T*3.1)*churn), STOM_S*(1-0.025*Math.sin(T*3.1)*churn));
  ctx.fillStyle = C.stom; ctx.fill(STOM);
  if (stomachLevel > 0.01){
    ctx.save(); ctx.clip(STOM);
    ctx.fillStyle = C.chyme;
    const top = 118 - 120*clamp01(stomachLevel);
    ctx.beginPath(); ctx.moveTo(-60, top);
    for (let x=-60; x<=70; x+=10) ctx.lineTo(x, top + Math.sin(x*0.12 + T*2.4)*2.5);
    ctx.lineTo(70,124); ctx.lineTo(-60,124); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.5; ctx.fillStyle = "#FFE8C8";
    for (let i=0;i<4;i++){
      const ph = (T*0.5 + i*0.27) % 1;
      ctx.beginPath(); ctx.ellipse(-26+i*18, 112-ph*(110-top), 3+i*0.9, 3+i*0.9, 0,0,6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  ctx.strokeStyle = C.stomSh; ctx.lineWidth = 2; ctx.stroke(STOM);
  ctx.restore();

  /* --- the cage again, faintly, over the organs: without this second pass the
         ribs vanish behind the lungs and the body stops reading as a skeleton --- */
  ctx.globalAlpha = 0.34; blit(ctx, bakedSkel, 0, 0); ctx.globalAlpha = 1;

  /* --- a highlight ring when an organ has just been tapped --- */
  if (spotRing && spotRingT > 0){
    const u = 1 - spotRingT/1.6;
    ctx.strokeStyle = "rgba(91,192,190," + (0.85*(1-u)).toFixed(3) + ")";
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.ellipse(spotRing.x, spotRing.y, spotRing.r*(1+u*0.25), spotRing.r*(1+u*0.25), 0,0,6.2832);
    ctx.stroke();
  }

  /* --- translucent skin over the torso: a transparency overlay, never a
         dissection. No cut edges, no peeled flaps — that is what keeps it
         friendly instead of gory. --- */
  ctx.save();
  ctx.translate(CX, 340); ctx.scale(1+0.025*b, 1+0.045*b); ctx.translate(-CX, -340);
  ctx.fillStyle = C.skin; ctx.fill(torsoPath);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; ctx.stroke(torsoPath);
  ctx.restore();

  /* --- head --- */
  const sq = squashT >= 0 ? squashCurve(clamp01(squashT/0.45)) : { sx:1, sy:1 };
  ctx.save();
  ctx.translate(180, 150); ctx.scale(sq.sx, sq.sy); ctx.translate(-180, -150);
  ctx.fillStyle = C.skinSolid;
  rr(ctx, 162, 138, 36, 40, 13); ctx.fill();

  if (organGlow.brain > 0.01 || organGlow.eyes > 0.01){
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = Math.max(organGlow.brain, organGlow.eyes)*0.45;
    ctx.drawImage(GLOW.pink, 110, 20, 140, 140);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }
  blit(ctx, bakedBrain, 0, 0);
  if (organGlow.brain > 0.01){
    ctx.globalCompositeOperation = "lighter";
    for (let i=0;i<4;i++){
      const ph = (T*1.1 + i*0.25) % 1;
      ctx.globalAlpha = Math.sin(ph*Math.PI)*organGlow.brain*0.9;
      ctx.drawImage(GLOW.gold, 152+i*20 - 7, 68 + Math.sin(ph*6.28+i)*6 - 7, 14, 14);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }

  ctx.fillStyle = C.skin;
  ctx.beginPath(); ctx.ellipse(180, 90, 55, 60, 0, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; ctx.stroke();

  ctx.save();                                            // hair, clipped to the head
  ctx.beginPath(); ctx.ellipse(180, 90, 55, 60, 0, 0, 6.2832); ctx.clip();
  ctx.fillStyle = C.hair;
  ctx.beginPath();
  ctx.moveTo(118, 116);
  ctx.lineTo(118, 18); ctx.lineTo(242, 18); ctx.lineTo(242, 116);
  ctx.bezierCurveTo(238, 86, 228, 62, 212, 54);
  ctx.bezierCurveTo(200, 48, 160, 48, 148, 54);
  ctx.bezierCurveTo(132, 62, 122, 86, 118, 116);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.hairHi; ctx.globalAlpha = 0.42;
  ctx.beginPath(); ctx.ellipse(150, 44, 17, 7, -0.45, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();

  const eo = eyeOpen();
  const browLift = Math.max(organGlow.brain, organGlow.eyes)*4;
  ctx.fillStyle = "#3D405B";
  [[158,1],[202,-1]].forEach(function(E){
    if (eo < 0.12){
      ctx.strokeStyle = "#3D405B"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(E[0], 116, 9, 0.15, Math.PI-0.15); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.ellipse(E[0], 116, 9.5, 11.5*eo, 0, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.ellipse(E[0]+3, 112, 3, 3.4*eo, 0, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "#3D405B";
    }
    ctx.strokeStyle = C.hair; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(E[0], 106-browLift, 11, Math.PI+0.3, -0.3); ctx.stroke();
  });

  /* mouth — opens while chewing, and you can see the teeth doing the work */
  const chewing = squashT >= 0;
  if (chewing){
    const open = Math.sin(clamp01(squashT/0.45)*Math.PI)*7;
    ctx.fillStyle = "#B35A66";
    ctx.beginPath(); ctx.ellipse(180, 136, 15, 5+open, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#FFF8EC";
    for (let i=0;i<5;i++) rr(ctx, 167+i*6, 130, 5, 4.5, 1.6), ctx.fill();
  } else {
    ctx.strokeStyle = "#C9636F"; ctx.lineWidth = 3;
    const smile = 6 + organGlow.build*3 + organGlow.eyes*3;
    ctx.beginPath(); ctx.moveTo(168, 134); ctx.quadraticCurveTo(180, 134+smile, 192, 134); ctx.stroke();
  }
  ctx.fillStyle = "rgba(255,150,160,0.35)";
  ctx.beginPath(); ctx.ellipse(144,128,9,6,0,0,6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(216,128,9,6,0,0,6.2832); ctx.fill();
  ctx.restore();

  ctx.restore();  // body transform

  drawParticles(ctx, dt);

  if (flying){
    ctx.save();
    const u = clamp01(flying.t/0.5);
    const e = easeOutBack(u);
    const x = lerp(flying.x0, 180, e), y = lerp(flying.y0, 140, e);
    ctx.globalAlpha = u > 0.88 ? (1-u)/0.12 : 1;
    ctx.font = "34px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.translate(x,y); ctx.rotate(Math.sin(u*7)*0.3*(1-u)); ctx.scale(1-u*0.25, 1-u*0.25);
    ctx.fillText(flying.e, 0, 0);
    ctx.restore();
  }
  ctx.restore();
}

/* tap anywhere on the body to meet that organ */
function onCanvasTap(ev){
  if (!started || busy) return;
  const r = cv.getBoundingClientRect();
  const x = (ev.clientX - r.left - offX)/fit;
  const y = (ev.clientY - r.top  - offY)/fit - bob(T);
  for (const sp of SPOTS){
    if (Math.hypot(x-sp.x, y-sp.y) <= sp.r){
      spotRing = sp; spotRingT = 1.6;
      caption("<b>"+sp.n+"</b> — "+sp.s.split("— ")[1], 4.0);
      speak(sp.s.replace(" — ", ". "));
      sfx("click");
      return;
    }
  }
}

/* ============================ voice ============================
   Web Speech, offline via the device's own voices. Gated by the shared mute
   flag, exactly like abc-missing-letter and trace-and-spell. */
let _voice = null;
function pickVoice(){
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices() || [];
  _voice = vs.find(function(v){ return /en-IN|en_IN/i.test(v.lang); })
        || vs.find(function(v){ return /en-GB/i.test(v.lang) && /female|kate|serena/i.test(v.name); })
        || vs.find(function(v){ return /en-GB/i.test(v.lang); })
        || vs.find(function(v){ return /^en/i.test(v.lang); }) || null;
}
if ("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function isMuted(){ try { return localStorage.getItem("miniGames.muted") === "1"; } catch(e){ return false; } }
function speak(text, rate){
  if (!("speechSynthesis" in window) || isMuted() || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (_voice) u.voice = _voice;
    u.lang = (_voice && _voice.lang) || "en-IN";
    u.rate = rate || 0.92; u.pitch = 1.1;
    speechSynthesis.speak(u);
  } catch(e){}
}
function sfx(n){ try { if (window.Banter && Banter.sfx) Banter.sfx(n); } catch(e){} }

/* ============================ emoji fallback ============================
   🫘 (beans) only reached Android 12L/13 and 🫓 (flatbread) Android 11, so on
   a budget phone they render as a tofu box. Swap those for an older glyph.
   Every food also carries a text label, which fixes this for good. */
function hasEmoji(ch){
  try {
    const c = document.createElement("canvas"); c.width = c.height = 24;
    const x = c.getContext("2d"); x.textBaseline = "top"; x.font = "20px serif";
    x.fillText(ch, 0, 0); const a = c.toDataURL();
    x.clearRect(0,0,24,24); x.fillText("￿", 0, 0);
    return a !== c.toDataURL();
  } catch(e){ return true; }
}
function resolveEmoji(){
  FOODS.forEach(function(f){ if (f.fb && !hasEmoji(f.e)) f.e = f.fb; });
}

const meters = { build:0, bones:0, brain:0, eyes:0, tummy:0, water:0 };
let plate = [];          // foods placed this meal
let tray = [];           // foods currently offered
let meal = 1;            // 1..3 == one day
let teethAcid = 0;       // 1 = acid attack now, decays back to calm
let teethWasAttacked = false;
let busy = false;
let phase = null, ph_t = 0, ph_food = null, ph_spawned = 0;
let discovered = loadSet("miniGames.insideMe.found");

function loadSet(k){ try { return new Set(JSON.parse(localStorage.getItem(k) || "[]")); } catch(e){ return new Set(); } }
function saveSet(k, s){ try { localStorage.setItem(k, JSON.stringify(Array.from(s))); } catch(e){} }
function ls(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  plateEl.innerHTML = "";

    const d = document.createElement("div");
    const fun = (i === SLOTS-1);
    d.className = "slot" + (fun ? " fun" : "") + (plate[i] ? " full" : "");

/* ============================ UI: tray ============================ */
const trayEl = document.getElementById("tray");
const everyday = FOODS.filter(function(f){ return f.g !== "sometimes"; });
const sometimes = FOODS.filter(function(f){ return f.g === "sometimes"; });
function shuffled(a){ const b = a.slice(); for (let i=b.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=b[i]; b[i]=b[j]; b[j]=t; } return b; }

function dealTray(){
  const onPlate = new Set(plate.map(function(f){ return f.n; }));
  const pickFrom = shuffled(everyday).filter(function(f){ return !onPlate.has(f.n); });
  tray = pickFrom.slice(0, 7);
  /* Sometimes-foods stay present and honest, but rare — children who played
     ANY food-themed game ate more afterwards, sweets included, even when the
     game showed fruit. So this is never the thing the game is about. */
  if (Math.random() < 0.55){
    const s = shuffled(sometimes).filter(function(f){ return !onPlate.has(f.n); })[0];
    if (s) tray.push(s);
  } else {
    const extra = pickFrom[7];
    if (extra) tray.push(extra);
  }
  tray = shuffled(tray);
  renderTray();
}
function renderTray(){
  trayEl.innerHTML = "";
  tray.forEach(function(f){
    const b = document.createElement("button");
    b.className = "food"; b.type = "button";
    b.innerHTML = '<span class="fe">'+f.e+'</span><span class="fn">'+f.n+'</span>';
    b.addEventListener("pointerdown", function(ev){ ev.preventDefault(); onFood(f, b); });
    trayEl.appendChild(b);
  });
}

/* ============================ eating ============================ */
let lastTap = 0;
function onFood(f, btn){
  const now = performance.now();
  if (now - lastTap < 250) return;      // children double-fire; ignore the echo
  lastTap = now;
  if (busy || plate.length >= SLOTS) return;
  busy = true;
  const r = btn.getBoundingClientRect(), cr = cv.getBoundingClientRect();
  flying = { e:f.e, t:0,
             x0:(r.left + r.width/2 - cr.left - offX)/fit,
             y0:(r.top  + r.height/2 - cr.top  - offY)/fit };
  phase = "fly"; ph_t = 0; ph_food = f; ph_spawned = 0;
  speak(f.n);
  sfx("click");
}

function combosFor(f){
  const out = [];
  const names = plate.map(function(p){ return p.n; });
  const has = function(fn){ return plate.some(fn); };
  if (f.fe && has(function(p){ return p.vc; }))
    out.push("🍋 <b>Together!</b> The vitamin C helped your body grab much more iron from the "+f.n.toLowerCase()+".");
  if (f.vc && has(function(p){ return p.fe; }))
    out.push("🍋 <b>Together!</b> That vitamin C just unlocked extra iron from the beans.");
  if (f.fat && has(function(p){ return p.gives && p.gives.indexOf("eyes") >= 0; }))
    out.push("🧈 <b>Together!</b> A little fat helps the orange vitamin A actually get in.");
  if (f.gives && f.gives.indexOf("eyes") >= 0 && has(function(p){ return p.fat; }))
    out.push("🧈 <b>Together!</b> The fat already on your plate helps this vitamin A get in.");
  if (f.gives && f.gives.indexOf("bones") >= 0 && names.indexOf("Fish") >= 0)
    out.push("☀️ <b>Together!</b> Vitamin D from the fish lets that calcium into your bones.");
  return out;
}

function finishFood(f){
  /* meters */
  (f.gives || []).forEach(function(k){
    if (k in meters){ meters[k] = Math.min(100, meters[k] + 22); pulseOrgan(k); }
  });
  /* sugar -> acid attack on the teeth, and the frequency lesson */
  if (f.sug){
    const again = teethAcid > 0.15;
    teethAcid = Math.min(1, teethAcid + (f.teeth || 1) * 0.55);
    teethWasAttacked = true;
    if (again) setTimeout(function(){
      caption("🦷 The acid never got a chance to stop. <b>How often</b> matters more than how much.", 4.4);
      speak("The acid never got a chance to stop.");
    }, 2600);
  }
  if (f.salt){
    meters.water = Math.max(0, meters.water - 14);
    setTimeout(function(){
      caption("🧂 Salty! Your body is asking for <b>water</b> to balance it out.", 3.6);
    }, 2600);
  }
  if (f.slow){ stomachLevel = Math.min(1, stomachLevel + 0.18); }
  if (!discovered.has(f.n)){ discovered.add(f.n); newCount++; saveSet("miniGames.insideMe.found", discovered); }

  plate.push(f);
  syncPlate(); syncMeters();
  busy = false;
  if (plate.length >= SLOTS) setTimeout(mealReport, 1400);
  else dealTray();
}

function updateEating(dt){
  if (!phase) return;
  ph_t += dt;
  const f = ph_food;
  if (phase === "fly"){
    if (flying) flying.t += dt;
    if (ph_t >= 0.5){ flying = null; phase = "chew"; ph_t = 0; squashT = 0; sfx("drop"); }
  } else if (phase === "chew"){
    squashT += dt;
    if (ph_t >= 0.45){ squashT = -1; phase = "swallow"; ph_t = 0; bulgeT = 0; kick(2); }
  } else if (phase === "swallow"){
    bulgeT += dt;
    if (ph_t >= 0.6){
      bulgeT = -1; phase = "digest"; ph_t = 0;
      stomachLevel = Math.min(1, stomachLevel + 0.26);
      churn = 1; sfx("pot"); kick(2.5);
      const extra = combosFor(f);
      caption("<b>"+f.n+"</b> — "+f.line, 3.6);
      speak(f.line);
      if (extra.length) setTimeout(function(){ caption(extra[0], 4.2); speak(extra[0].replace(/<[^>]+>/g,"")); }, 3700);
    }
  } else if (phase === "digest"){
    const gives = (f.gives && f.gives.length) ? f.gives : null;
    if (gives && ph_t < 1.3){
      ph_spawned += dt;
      while (ph_spawned > 0.085){
        ph_spawned -= 0.085;
        spawnP(gives[(Math.random()*gives.length)|0]);
      }
    }
    if (ph_t >= 2.5){
      phase = null;
      bpmTarget = 92;
      finishFood(f);
    }
  }
}

/* ============================ screens ============================ */
const overlay = document.getElementById("overlay");
const panel = document.getElementById("panel");
let newCount = 0;
function show(html){ panel.innerHTML = html; overlay.classList.remove("hide"); }
function hide(){ overlay.classList.add("hide"); }

function mealGroups(){
  const g = new Set(), col = new Set();
  plate.forEach(function(f){
    if (f.g !== "sometimes") g.add(f.g);
    if (f.c) col.add(f.c);
  });
  return { g:g, col:col };
}

function mealReport(){
  const r = mealGroups();
  const core = ["veg","fruit","grain","protein","dairy"];
  const covered = core.filter(function(k){ return r.g.has(k); }).length;
  let stars = 0;
  if (covered >= 3) stars++;
  if (covered >= 5) stars++;
  if (r.col.size >= 3 || newCount >= 1) stars++;
  if (stars === 0) stars = 1;        // there is no losing here

  const chips = core.map(function(k){
    return '<span class="gchip'+(r.g.has(k)?" got":"")+'">'+GROUPS[k].i+" "+GROUPS[k].n+'</span>';
  }).join("");

  let msg;
  if (covered >= 5) msg = "You found all five! 🌈";
  else if (covered >= 3) msg = "Nice mix on that plate!";
  else msg = "Your body is still curious about the other groups.";

  const rainbow = Array.from(r.col).length;
  show(
    '<div class="big">'+plate.map(function(f){ return f.e; }).join("")+'</div>'+
    '<div class="stars">'+"⭐".repeat(stars)+"</div>"+
    "<h1>"+msg+"</h1>"+
    '<div class="groupRow">'+chips+"</div>"+
    "<p>"+rainbow+" different colour"+(rainbow===1?"":"s")+" on the plate"+
      (newCount ? " · "+newCount+" new food"+(newCount===1?"":"s")+" tried 🎉" : "")+"</p>"+
    '<button class="go" id="nextMeal">'+(meal >= 3 ? "See my day ▶" : "Next plate ▶")+"</button>"
  );
  sfx(stars >= 3 ? "win" : "great");
  speak(msg);
  document.getElementById("nextMeal").addEventListener("click", function(){
    if (meal >= 3) dayReport(); else nextMeal();
  });
}

function nextMeal(){
  meal++; newCount = 0;
  plate = [];
  stomachLevel = Math.max(0, stomachLevel - 0.5);
  syncPlate(); dealTray(); hide();
}

function dayReport(){
  const total = ORGANS.reduce(function(a,o){ return a + Math.min(100, meters[o.k]); }, 0);
  const avg = Math.round(total / ORGANS.length);
  const kit = ORGANS.filter(function(o){ return meters[o.k] >= 40; });
  const missing = ORGANS.filter(function(o){ return meters[o.k] < 40; });

  /* day streak — it pauses, it never punishes */
  const today = new Date().toDateString();
  let streak = parseInt(ls("miniGames.insideMe.streak","0"), 10) || 0;
  const last = ls("miniGames.insideMe.lastDay","");
  if (last !== today){
    const y = new Date(Date.now()-86400000).toDateString();
    streak = (last === y) ? streak+1 : 1;
    lsSet("miniGames.insideMe.streak", String(streak));
    lsSet("miniGames.insideMe.lastDay", today);
  }

  let teethLine = "";
  if (teethWasAttacked){
    teethLine = "<p>🦷 Your mouth had a sweet moment today. Saliva washes the acid away in about an hour — so having something sweet <b>all at once</b> is easier on teeth than nibbling it all afternoon.</p>";
  }

  show(
    '<div class="big">🌞</div>'+
    "<h1>What a day!</h1>"+
    "<p>Your body collected a toolkit of <b>"+avg+"%</b>.</p>"+
    '<div class="groupRow">'+ORGANS.map(function(o){
      return '<span class="gchip'+(meters[o.k]>=40?" got":"")+'">'+o.i+" "+o.n+"</span>"; }).join("")+"</div>"+
    (missing.length ? "<p>Still waiting for a bit more: "+missing.map(function(o){ return o.i+" "+o.n; }).join(", ")+"</p>"
                    : "<p>Every single part got what it needed. 🌈</p>")+
    teethLine+
    "<p>🔥 Day "+streak+" of your streak · "+discovered.size+" foods discovered</p>"+
    '<button class="go" id="toIntent">Next ▶</button>'
  );
  sfx("win");
  speak("What a day! Your body collected a toolkit.");
  document.getElementById("toIntent").addEventListener("click", intentionPicker);
}

/* The single highest-leverage mechanic in the behaviour-change research:
   a self-chosen, real-world intention, asked about on the next visit.
   Every answer is warm; nothing is ever marked wrong. */
function intentionPicker(){
  const picks = shuffled(everyday).slice(0,3);
  show(
    '<div class="big">🌱</div>'+
    "<h1>One real thing</h1>"+
    "<p>Pick something to <b>taste for real</b> before you play again. Just a taste counts!</p>"+
    '<div class="pick">'+picks.map(function(f,i){
      return '<button class="pickBtn" data-i="'+i+'"><span class="pe">'+f.e+'</span><span class="pn">'+f.n+"</span></button>";
    }).join("")+"</div>"+
    '<button class="go" id="intentDone">That one! ▶</button>'+
    '<button class="go alt" id="intentSkip">Maybe later</button>'
  );
  let sel = -1;
  Array.prototype.forEach.call(panel.querySelectorAll(".pickBtn"), function(b){
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(panel.querySelectorAll(".pickBtn"), function(x){ x.classList.remove("sel"); });
      b.classList.add("sel"); sel = parseInt(b.getAttribute("data-i"),10);
      speak(picks[sel].n);
    });
  });
  document.getElementById("intentDone").addEventListener("click", function(){
    if (sel < 0) return;
    lsSet("miniGames.insideMe.intent", picks[sel].n);
    lsSet("miniGames.insideMe.intentE", picks[sel].e);
    show('<div class="big">'+picks[sel].e+"</div><h1>It's a plan!</h1>"+
         "<p>Give <b>"+picks[sel].n+"</b> a taste. I'll ask you next time. 💛</p>"+
         '<button class="go" id="again">Play again ▶</button>');
    document.getElementById("again").addEventListener("click", resetDay);
  });
  document.getElementById("intentSkip").addEventListener("click", resetDay);
}

function resetDay(){
  meal = 1; newCount = 0; plate = [];
  ORGANS.forEach(function(o){ meters[o.k] = 0; });
  teethAcid = 0; teethWasAttacked = false; stomachLevel = 0;
  syncPlate(); syncMeters(); dealTray(); hide();
}

function askedAboutIntention(){
  const n = ls("miniGames.insideMe.intent","");
  if (!n) return false;
  const e = ls("miniGames.insideMe.intentE","🌱");
  show(
    '<div class="big">'+e+"</div>"+
    "<h1>Did you try "+n+"?</h1>"+
    '<button class="go" id="yes">Yes I did! 🎉</button>'+
    '<button class="go alt" id="notyet">Not yet</button>'+
    '<button class="go alt" id="again2">I\'ll try again</button>'
  );
  speak("Did you try " + n + "?");
  const done = function(msg){
    lsSet("miniGames.insideMe.intent","");
    show('<div class="big">💛</div><h1>'+msg+"</h1>"+
         '<button class="go" id="play2">Let\'s play ▶</button>');
    speak(msg);
    document.getElementById("play2").addEventListener("click", startGame);
  };
  document.getElementById("yes").addEventListener("click", function(){ sfx("win"); done("You explored something new!"); });
  document.getElementById("notyet").addEventListener("click", function(){ done("That's completely fine."); });
  document.getElementById("again2").addEventListener("click", function(){ done("No rush at all."); });
  return true;
}

function grownUps(){
  show(
    "<h1>For grown-ups</h1>"+
    '<p class="fine">'+
    "<b>No food is called good, bad or junk here.</b> Foods are <i>everyday</i> or "+
    "<i>sometimes</i>, which describes how often we eat them — not whether a child "+
    "is being good. Moralised food language is a known risk factor for disordered "+
    "eating, and traffic-light systems in schools have been criticised by "+
    "eating-disorder clinicians.<br><br>"+
    "<b>Nothing is ever punished.</b> No points are lost, no timers, no losing, and "+
    "the body never looks sad or sick. Restricting a food reliably makes children "+
    "want it more, so every plate has a free ⭐ slot for anything at all.<br><br>"+
    "<b>No calories, no weight, no body-size change</b> — in line with the American "+
    "Academy of Pediatrics' guidance that lifestyle, not weight, is what to talk "+
    "about with children.<br><br>"+
    "<b>A nutrient's job is revealed after eating</b>, never used beforehand as a "+
    "reason to eat. Children told a food would make them strong ate about half as "+
    "much of it.<br><br>"+
    "<b>No sugar-rush myth.</b> Twenty-three double-blind trials found sugar does "+
    "not make children hyperactive. The game shows what the evidence actually "+
    "shows: quick fuel, then a dip.<br><br>"+
    "<b>No sponsor, no ads, no data.</b> Everything runs offline on this device."+
    "</p>"+
    '<button class="go" id="closeG">Back ▶</button>'
  );
  document.getElementById("closeG").addEventListener("click", function(){
    if (started) hide(); else titleScreen();
  });
}

let started = false;

/* The rules, on the page, before anything else — and reachable any time from
   the ? button. Short lines, big pictures, no reading required to play. */
function howToPlay(fromGame){
  show(
    "<h1>How to play</h1>"+
    '<div class="rules">'+
      '<div class="rule"><span class="rn">🍽️</span><span class="rt"><b>Tap any food.</b> It gets chewed, swallowed, and you watch it travel all the way down.</span></div>'+
      '<div class="rule"><span class="rn">✨</span><span class="rt"><b>Watch where it goes.</b> The goodness flies off as glowing specks to the parts that use it — bones, muscles, eyes, brain, tummy.</span></div>'+
      '<div class="rule"><span class="rn">🍱</span><span class="rt"><b>Fill your plate — 5 foods.</b> The last ⭐ slot is a free slot. Put anything you like in it.</span></div>'+
      '<div class="rule"><span class="rn">🌈</span><span class="rt"><b>Try to find all five groups:</b><br>🥬 Veg · 🍎 Fruit · 🌾 Grain · 🫘 Protein · 🥛 Dairy<br>All five on one plate = ⭐⭐⭐</span></div>'+
      '<div class="rule"><span class="rn">☀️</span><span class="rt"><b>3 plates make a day.</b> Then you see everything your body collected.</span></div>'+
      '<div class="rule"><span class="rn">👆</span><span class="rt"><b>Poke the body!</b> Tap the heart, lungs, stomach or any part and it will tell you what it does.</span></div>'+
    "</div>"+
    "<p class=\"noLose\">There is no losing here, and nothing you pick is ever wrong. 💛</p>"+
    '<button class="go" id="rulesGo">'+(fromGame ? "Back to playing ▶" : "Let's play ▶")+"</button>"
  );
  document.getElementById("rulesGo").addEventListener("click", function(){
    if (fromGame) { hide(); return; }
    if (!askedAboutIntention()) startGame();
  });
}

function titleScreen(){
  show(
    '<div class="big">🫀</div>'+
    "<h1>Inside Me</h1>"+
    "<p>Feed this body and watch what happens <b>inside</b> — where every bite goes, "+
    "and what your body builds with it.</p>"+
    '<button class="go" id="play">How to play ▶</button>'
  );
  document.getElementById("play").addEventListener("click", function(){ howToPlay(false); });
}

function startGame(){
  started = true;
  hide();
  try { if (window.Banter && Banter.startMusic) Banter.startMusic(); } catch(e){}
  resetDay();
  caption("Tap a food to feed me! 🍽️", 3.4);
}

/* ============================ main loop ============================ */
function frame(ts){
  const dt = Math.min(0.05, (ts - lastTs)/1000) || 0;
  lastTs = ts;
  T += dt;
  fpsEma = fpsEma*0.92 + dt*1000*0.08;

  if (cv.clientWidth !== lastCW || cv.clientHeight !== lastCH) resize();

  updateBlink(dt);
  updateEating(dt);

  for (const k in organGlow) organGlow[k] = Math.max(0, organGlow[k] - dt*0.55);
  churn = Math.max(0, churn - dt*0.35);
  bpm = lerp(bpm, bpmTarget, Math.min(1, dt*2.2));
  if (teethAcid > 0){ teethAcid = Math.max(0, teethAcid - dt/45); syncMeters(); }
  if (capTimer > 0){ capTimer -= dt; if (capTimer <= 0) capEl.classList.remove("show"); }

  draw(dt);
  requestAnimationFrame(frame);
}

/* ============================ init ============================ */
function init(){
  resolveEmoji();
  buildTorso(); buildGlows(); buildFlows();
  buildMeters(); syncMeters(); syncPlate();
  resize();
  dealTray();
  titleScreen();
  document.getElementById("grownBtn").addEventListener("click", grownUps);
  document.getElementById("rulesBtn").addEventListener("click", function(){ howToPlay(true); });
  cv.addEventListener("pointerdown", onCanvasTap);
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function(){ setTimeout(resize, 120); });
  document.addEventListener("visibilitychange", function(){ lastTs = performance.now(); });
  requestAnimationFrame(function(ts){ lastTs = ts; requestAnimationFrame(frame); });
}
init();
</script>
